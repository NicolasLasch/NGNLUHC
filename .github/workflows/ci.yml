name: CI

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and run the tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          if-no-files-found: ignore

      - name: Plugin jar (download it from this run to test it)
        uses: actions/upload-artifact@v4
        with:
          name: NoGameNoLifeUHC-jar
          path: |
            build/libs/NoGameNoLifeUHC-*.jar
            !build/libs/*-sources.jar

  resource-pack:
    name: Resource pack generator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Regenerate the pack and the README pictures
        run: |
          python3 tools/generate_resourcepack.py
          python3 tools/make_readme_images.py
      - name: The regenerated pack must be structurally identical to the committed one
        run: |
          # Pixels can differ slightly between font versions, but the file list and glyph layout must not.
          git diff --exit-code -- src/main/resources/cards/glyphs.yml resourcepack/assets/ngnl/font/card.json resourcepack/pack.mcmeta
          test "$(ls resourcepack/assets/ngnl/textures/font/cards | wc -l)" = "232"

  smoke-test:
    name: Real Purpur server smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/download-artifact@v4
        with:
          name: NoGameNoLifeUHC-jar
          path: jar
      - name: Start a Purpur 1.21.4 server with the plugin and play a scripted game
        run: bash .github/scripts/smoke-test.sh
      - name: Server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-server-log
          path: smoke/server.log
          if-no-files-found: ignore
