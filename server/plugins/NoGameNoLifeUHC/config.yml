    think: true
    jibril: true
    azriel: true
    schwi: true
    ku: true
    ino: true
    ivan: true
    kainas: true
    miko: true
    shiro: true
    shi: true
    makoto: true
    sora: true
factions:
  bonuses-enabled: true
  reveal-on-death: true
  proximity-bonus: true
  betrayal-penalty: true
  enabled:
    other: true
    werebeasts: true
    imanity: true
