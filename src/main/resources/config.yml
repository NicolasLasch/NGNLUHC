# ========================= #
#   No Game No Life UHC    #
#      Configuration       #
# ========================= #

# Game settings
game:
  # Length of episodes in minutes
  episode_length: 1

  # Number of players remaining to trigger arena phase
  arena_player_threshold: 2

  # Minimum number of players required to start the game
  minimum_players: 4

  # Whether roles should be assigned randomly
  # If false, roles will be assigned from the roles.yml file
  random_role_assignment: true

  # Whether solo roles can form alliances
  allow_solo_alliances: true

  # Whether PvP should be force enabled
  # If false, PvP will follow UHC rules
  force_enable_pvp: false

  # Time in minutes when Aka Si Anse appears
  # Random location will be announced between 50-80 minutes
  aka_si_anse_appear_time: 60

# World settings
world:
  # Mining world border size (radius in blocks)
  mining_world_border_size: 1000

  # Arena world border size (radius in blocks)
  arena_world_border_size: 300

  # Whether worlds should be destroyed after game
  destroy_worlds_after_game: false

  # World generation settings
  generation:
    # Seed for mining world (leave empty for random)
    mining_seed: ""

    # Seed for arena world (leave empty for random)
    arena_seed: ""

minigames:
  default_time: 300

  enabled:
    SPLEEF: true
    TNT_RUN: true
    PARKOUR: true
    BLOC_PARTY: true
    SUMO: true
    SPLEGG: true
    FLOOR_IS_LAVA: true
    DES_A_COUDRE: true
    ANVIL_RAIN: true
    WORD_CHAIN_BATTLE: true
    LOGICAL_DEDUCTION: true
    MENTAL_CHESS: true
    MEMORY_GAME: true
    MATERIALIZATION_SHIRITORI: true

# Scoreboard settings
scoreboard:
  # Title of the scoreboard
  title: "&6&lNo Game No Life UHC"

  # Whether to show the current episode
  show_episode: true

  # Whether to show the remaining time in episode
  show_time: true

  # Whether to show the current phase
  show_phase: true

  # Whether to show the number of players alive
  show_players: true

  # Whether to show the player's role (only visible to the player)
  show_role: true

# Special items settings
items:
  # Whether Aka Si Anse should appear
  aka_si_anse_enabled: true

  # Whether Suniaster should appear
  suniaster_enabled: true

  # Whether Blood Destruction Bomb should appear
  blood_destruction_bomb_enabled: true

  # Whether Elf Runes should appear
  elf_runes_enabled: true

  # Whether Imanity Crown should appear
  imanity_crown_enabled: true

  # Whether Ex-Machina Core should appear
  ex_machina_core_enabled: true

  # Whether Old Deus Fragment should appear
  old_deus_fragment_enabled: true

arena:
  world-name: "ngnl_arena_city"
  initial-border-size: 300
  final-border-size: 50
  border-shrink-interval: 120
  total-duration: 1200
  quake-weapon:
    damage: 4.0
    cooldown: 1000
    knockback: 1.5
    range: 100

# Debug settings
debug:
  # Whether to enable debug mode
  enabled: false

  # Whether to log detailed information
  verbose: false
