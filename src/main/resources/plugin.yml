name: NoGameNoLifeUHC
main: be.thespattt.ngnl.NoGameNoLife
version: 1.0.0
api-version: 1.21
author: TheSpatt
description: A UHC plugin inspired by the anime No Game No Life
website: https://github.com/TheSpatt/NoGameNoLifeUHC
softdepend: [ProtocolLib, packetevents, PacketEvents]

commands:
  ngnl:
    description: Main command for NoGameNoLife UHC
    usage: /ngnl <start|stop|roles|settings|arena>
    permission: ngnl.admin

  challenge:
    description: Challenge another player to a game
    usage: /challenge <player> <wager>
    permission: ngnl.player

  duo:
    description: Commands for duo roles
    usage: /duo <substitute|bonus|message>

  alliance:
    description: Form an alliance with another solo player
    usage: /alliance <player>
    permission: ngnl.player

  pledge:
    description: Create a binding pledge with another player
    usage: /pledge <player> <terms>
    permission: ngnl.player

  heal:
    description: Transfer health to your partner (Riku only)
    usage: /heal
    permission: ngnl.player

  rite:
    description: Perform a rite (Think only)
    usage: /rite <number>
    permission: ngnl.player

  forest:
    description: Access forest inventory (Kainas only)
    usage: /forest
    permission: ngnl.player

  teleport:
    description: Exchange the position of two players (Holou only)
    usage: /teleport <player1> <player2>
    permission: ngnl.player

  substitute:
    description: Ask Shiro to replace Sora in the pending mini-game
    usage: /substitute
    permission: ngnl.player

  acceptsub:
    description: Accept Sora's substitution request
    usage: /acceptsub
    permission: ngnl.player

  bonus:
    description: Give Sora a mini-game bonus (Shiro only)
    usage: /bonus
    permission: ngnl.player

  ngnladmin:
    description: No Game No Life UHC admin commands
    usage: /ngnladmin <subcommand>
    permission: ngnl.admin
    aliases: [ ngadmin ]
  ngnlconfig:
    description: Open the No Game No Life configuration GUI
    usage: /ngnlconfig
    permission: ngnl.admin
  rps:
    description: Rock Paper Scissors challenge command
    usage: /rps <player> <wager>
    permission: ngnl.player
  minigame:
    description: Manage mini-games
    usage: /minigame <select|move|forfeit|help>
    permission: ngnl.player
    aliases: [ mg ]
  forcekill:
    description: Force a player's health to 0 for testing
    usage: /forcekill <player> [hearts]
    permission: ngnl.admin.forcekill
  role:
    description: View your role information
    usage: /role
    permission: ngnl.player
    aliases: [ r ]
  chess:
    description: Reopen the chess board if it was closed
    usage: /chess
    permission: ngnl.player

permissions:
  ngnl.admin:
    description: Allows access to admin commands
    default: op

  ngnl.player:
    description: Allows access to player commands
    default: true
